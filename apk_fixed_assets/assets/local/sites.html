<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="refresh" content="0; url=https://force-racing.force-racing-revival.workers.dev/">
    <title>Force Racing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0a0b0e 0%, #13151b 50%, #0d0e12 100%);
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 24px;
        }
        .logo-wrap {
            position: relative;
            margin-bottom: 24px;
        }
        .logo {
            width: 108px;
            height: 108px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(225, 6, 0, 0.35), 0 0 20px rgba(0, 210, 190, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(225, 6, 0, 0.4)); }
            50% { transform: scale(1.04); filter: drop-shadow(0 0 22px rgba(225, 6, 0, 0.7)); }
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff1801, #ffffff, #00d2be);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        .status {
            font-size: 14px;
            color: #8f9ca8;
            letter-spacing: 0.5px;
            margin-bottom: 28px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #e10600;
            border-right: 3px solid #00d2be;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        window.location.replace("https://force-racing.force-racing-revival.workers.dev/");
    </script>
</head>
